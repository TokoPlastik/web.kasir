<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toko Plastik Pasar Lama</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #0f172a; color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* HEADER */
        .header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 2px solid #0ea5e9; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .nav-btn { background: #0ea5e9; color: white; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.3s; }
        .nav-btn:hover { background: #0284c7; }
        
        /* LAYOUT CORE */
        .container { display: flex; flex: 1; height: calc(100vh - 65px); overflow: hidden; flex-direction: row; }
        .menu { flex: 1.5; padding: 25px; overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.1); scrollbar-width: thin; scrollbar-color: #0ea5e9 transparent; }
        .cart { flex: 1; background: rgba(15, 23, 42, 0.3); padding: 25px; display: flex; flex-direction: column; overflow-y: auto; }
        
        /* CARDS & INPUTS */
        .card { background: rgba(30, 41, 59, 0.7); padding: 18px; border-radius: 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.3s; }
        .card:hover { border-color: #0ea5e9; }
        
        input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.6); color: white; font-size: 15px; outline: none; }
        input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2); }
        
        /* BUTTONS */
        .btn-main { width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 16px; margin-top: 10px; transition: 0.3s; color: white; }
        .btn-main:active { transform: scale(0.98); }
        .btn-add { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        
        /* CART ITEM */
        #cartList { min-height: 120px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .qty-btn { background: #334155; color: white; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; }

        /* BADGE GROSIR */
        .badge-grosir { background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-left: 5px; border: 1px solid rgba(16, 185, 129, 0.3); }

        /* LOGIN */
        .login { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .login-box { background: rgba(30, 41, 59, 0.8); padding: 40px; border-radius: 24px; width: 380px; text-align: center; border: 1px solid rgba(14, 165, 233, 0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }

        /* 📱 MEDIA QUERY KHUSUS ANDROID / HP */
        @media (max-width: 768px) {
            body { overflow-y: auto; height: auto; }
            .container { flex-direction: column-reverse; height: auto; overflow: visible; }
            .menu { width: 100%; padding: 15px; overflow: visible; border-right: none; }
            
            /* Di HP, Keranjang otomatis naik ke atas agar info nominal & tombol bayar langsung terlihat tanpa scroll */
            .cart { width: 100%; padding: 15px; height: auto; background: rgba(15, 23, 42, 0.9); border-bottom: 2px solid rgba(255,255,255,0.1); }
        }
    </style>
</head>
<body>

<div class="login" id="loginPage">
    <div class="login-box">
        <h2 style="font-size: 24px; margin-bottom: 25px; color: #0ea5e9;">🛍️ Toko Plastik<br><span style="color:white; font-size: 0.8em;">Pasar Lama</span></h2>
        <input id="username" placeholder="Username (admin)">
        <input id="password" type="password" placeholder="Password (123)">
        <button class="btn-main" id="btnLogin" style="background: #0ea5e9;">Masuk Sistem</button>
    </div>
</div>

<div class="app" id="app" style="display: none;">
    <div class="header">
        <span style="font-size: 1.1em; letter-spacing: 1px;">📦 TOKO PLASTIK <span style="color: #0ea5e9;">PASAR LAMA</span></span>
        <div>
            <button class="nav-btn" onclick="showMenuPage()">📋 Menu</button>
            <button class="nav-btn" onclick="showRiwayatPage()">📊 Riwayat</button>
        </div>
    </div>
    
    <div class="container">
        <div class="menu" id="menuPage">
            <div id="tambahSection" class="card" style="border: 2px dashed #10b981; background: rgba(16, 185, 129, 0.05);">
                <h3 style="margin:0 0 15px 0; color:#10b981; font-size: 1.1em;">➕ Tambah Stok Barang</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <input id="nama" placeholder="Nama plastik/barang...">
                    <input id="harga" placeholder="Harga (Rp)" oninput="formatRupiah(this)">
                </div>
                <button class="btn-main" onclick="tambahBarang()" style="background:#10b981;">Simpan ke Database</button>
            </div>

            <input id="search" placeholder="🔍 Cari plastik atau harga..." style="margin-top:20px;">
            <h4 style="color: #94a3b8; margin: 20px 0 10px 0; font-size: 0.9em; letter-spacing: 1px;">🔤 DAFTAR STOK (A-Z)</h4>
            <div id="menuList"></div>
            
            <div class="card" style="background: linear-gradient(90deg, #0f172a, #1e293b); border-left: 5px solid #10b981;">
                <small style="color: #94a3b8;">💰 Total Penjualan Hari Ini:</small>
                <div id="totalHarian" style="font-size: 1.8em; font-weight: 600; color:#10b981;">Rp0</div>
            </div>
        </div>

        <div class="riwayat-page" id="riwayatPage" style="display:none; width:100%; padding: 25px; overflow-y: auto;">
            <h2 style="color: #0ea5e9;">📊 Riwayat Penjualan</h2>
            <div id="riwayat"></div>
            <button class="btn-main" onclick="clearRiwayat()" style="background:#ef4444; margin-top: 30px;">🗑️ Kosongkan Riwayat</button>
        </div>

        <div class="cart" id="cartSection">
            <h2 style="font-size: 1.4em; margin-bottom: 20px;">🛒 Keranjang Belanja</h2>
            <div id="cartList"></div>
            
            <div class="card" style="background: rgba(15, 23, 42, 0.8); margin-top: auto;">
                <h3 id="total" style="margin: 0; color: #10b981; font-size: 1.5em; font-weight: 700; text-align: right;">Total: Rp0</h3>
                
                <div style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px; margin-top: 5px;">
                    <div>
                        <label style="font-size: 11px; color:#94a3b8;">POTONGAN (Rp)</label>
                        <input id="diskon" placeholder="0" oninput="formatRupiah(this); hitungKembalian()" style="margin: 2px 0;">
                    </div>
                    <div>
                        <label style="font-size: 11px; color:#94a3b8;">UANG TUNAI (Rp)</label>
                        <input id="bayar" placeholder="0" oninput="formatRupiah(this); hitungKembalian()" style="margin: 2px 0;">
                    </div>
                </div>
                
                <div id="kembalian" style="padding:12px; border-radius:10px; margin:10px 0; font-weight: 600; text-align: center; background: rgba(255,255,255,0.02); color:#64748b;">Kembalian: Rp0</div>
                
                <div style="display: flex; gap: 10px;">
                    <button class="btn-main" onclick="printStruk()" style="background:#334155; flex: 1;">🖨️ Struk</button>
                    <button class="btn-main" onclick="selesaiTransaksi()" style="background:#0ea5e9; flex: 2;">✅ Selesai</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
